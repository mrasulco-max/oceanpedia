name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: oceanpedia, POSTGRES_PASSWORD: ci, POSTGRES_DB: oceanpedia }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oceanpedia" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://oceanpedia:ci@localhost:5432/oceanpedia?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache: false }
      - name: Modul
        run: go mod tidy && go mod verify
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Unit test
        run: go test -race -count=1 ./...
      - name: Integration test (PostgreSQL)
        shell: bash
        run: |
          set -o pipefail
          # Baris kegagalan juga ditulis sebagai anotasi agar terlihat tanpa membuka log lengkap.
          go test -count=1 -tags integration ./internal/store/ 2>&1 | tee /tmp/it.log || { grep -E "FAIL|_test.go:|panic|ERROR" /tmp/it.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - run: go build -trimpath -o bin/api ./cmd/api
      - uses: actions/upload-artifact@v4
        with: { name: api-bin, path: api/bin/api, retention-days: 3 }

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }
      - name: Simpan build
        run: tar -czf /tmp/web-build.tgz .next public package.json node_modules next.config.ts
      - uses: actions/upload-artifact@v4
        with: { name: web-build, path: /tmp/web-build.tgz, retention-days: 3 }

  smoke:
    name: Smoke test (desktop vs mobile)
    needs: [api, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: oceanpedia, POSTGRES_PASSWORD: ci, POSTGRES_DB: oceanpedia }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oceanpedia" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://oceanpedia:ci@localhost:5432/oceanpedia?sslmode=disable
      API_JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      API_ENV: development
      # Uji beruntun cepat dari satu IP: jangan sampai terkena batas laju (429).
      API_RATE_LIMIT_RPS: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/download-artifact@v4
        with: { name: api-bin, path: bin }
      - uses: actions/download-artifact@v4
        with: { name: web-build, path: /tmp }
      - name: Jalankan API + seed
        run: |
          chmod +x bin/api
          ./bin/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 1; done
          PGPASSWORD=ci psql -h localhost -U oceanpedia -d oceanpedia -v ON_ERROR_STOP=1 -f db/seed/dev_seed.sql
      - name: Uji API
        run: |
          set -e
          curl -sf localhost:8080/v1/home | jq -e '.latest | length > 5'
          curl -sf "localhost:8080/v1/market/quotes?symbols=BBCA,BTCUSD" | jq -e '.data | length == 2'
          curl -sf "localhost:8080/v1/ads?surface=web&page=legal" | jq -e '.data | length == 2'
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/articles/tidak-ada); test "$code" = 404
          # Daftar → wajib OTP (kode pengembangan 000000) → masuk tanpa OTP.
          curl -sf -X POST localhost:8080/v1/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"Sandi-rahasia1","full_name":"CI Bot","phone":"0812 3456 7890"}' | jq -e '.status == "verification_required"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"Sandi-rahasia1"}'); test "$code" = 403
          curl -sf -X POST localhost:8080/v1/auth/verify -H 'Content-Type: application/json' -d '{"email":"ci@example.com","code":"000000"}' | jq -e '.access_token | length > 20'
          curl -sf -X POST localhost:8080/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"Sandi-rahasia1"}' | jq -e '.user.email_verified == true'
          curl -sf "localhost:8080/v1/search?q=bbca" | jq -e '.result.instruments[0].symbol == "BBCA"'
          # Profil: baca, ubah data & preferensi, perangkat aktif.
          TOKEN=$(curl -sf -X POST localhost:8080/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"Sandi-rahasia1"}' | jq -r .access_token)
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8080/v1/me/profile | jq -e '.profile.stats.watchlist == 0 and .alert_limit == 3'
          curl -sf -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' localhost:8080/v1/me -d '{"full_name":"CI Bot 2","preferences":{"breaking":false,"theme":"dark"}}' | jq -e '.profile.full_name == "CI Bot 2" and .profile.preferences.breaking == false'
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8080/v1/me/sessions | jq -e '.data | length >= 1'
          # Verifikasi 2 langkah opsional untuk pembaca (kode lewat email).
          curl -sf -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' localhost:8080/v1/me -d '{"two_factor":true}' | jq -e '.profile.two_factor == true and .profile.preferences.theme == "dark"'
          curl -s -X POST localhost:8080/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"Sandi-rahasia1"}' | jq -e '.type | contains("two-factor-required")'
          curl -sf -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' localhost:8080/v1/me -d '{"two_factor":false}' | jq -e '.profile.two_factor == false'
          curl -sf -X POST localhost:8080/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"Sandi-rahasia1"}' | jq -e '.access_token | length > 20'
          # Fitur pembaca: topik, notifikasi, pengingat kalender, price alert yang terpicu.
          curl -sf localhost:8080/v1/topics/ihsg | jq -e '.topic.slug == "ihsg" and .topic.following == false and (.articles | type == "array")'
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/topics/tidak-ada); test "$code" = 404
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" localhost:8080/v1/me/topics/ihsg); test "$code" = 204
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8080/v1/topics/ihsg | jq -e '.topic.following == true and .topic.followers >= 1'
          EV=$(curl -sf "localhost:8080/v1/events?days=7" | jq -r '.data[0].id')
          if [ "$EV" != "null" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" "localhost:8080/v1/me/reminders/$EV"); test "$code" = 204
            curl -sf -H "Authorization: Bearer $TOKEN" localhost:8080/v1/me/reminders | jq -e --arg ev "$EV" '.data | index($ev) != null'
          fi
          SYM=$(curl -sf localhost:8080/v1/market/instruments | jq -r '[.data[].symbol | select(. != "BBCA" and . != "BTCUSD")][0]')
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' localhost:8080/v1/me/alerts -d "{\"symbol\":\"$SYM\",\"condition\":\"price_above\",\"threshold\":0.0001,\"channels\":[\"in_app\"]}" | jq -e '.id | length > 10'
          curl -sf "localhost:8080/v1/market/quotes?symbols=$SYM" > /dev/null
          curl -sf -H "Authorization: Bearer $TOKEN" "localhost:8080/v1/me/notifications?kind=price_alert" | jq -e --arg s "$SYM" '(.data | length >= 1) and .data[0].symbol == $s and .unread >= 1'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' localhost:8080/v1/me/notifications/read -d '{}'); test "$code" = 204
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8080/v1/me/notifications | jq -e '.unread == 0'
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8080/v1/me/alerts | jq -e '[.data[] | select(.active == false)] | length >= 1'
          # Plus: checkout (mode manual tanpa kunci Midtrans) → simulasi lunas → langganan aktif.
          CK=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' localhost:8080/v1/billing/checkout -d '{"plan_code":"essential","method":"qris","promo_code":"plusbaru"}')
          echo "$CK" | jq -e '.provider == "manual" and .invoice.total == 10989 and (.order_id | startswith("INV-OP-"))'
          INV=$(echo "$CK" | jq -r .invoice.id)
          curl -sf -H "Authorization: Bearer $TOKEN" "localhost:8080/v1/billing/invoices/$INV" | jq -e '.status == "open" and .payment_status == "pending" and .method == "qris"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' localhost:8080/v1/billing/checkout -d '{"plan_code":"essential","method":"bitcoin"}'); test "$code" = 422
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "localhost:8080/v1/billing/invoices/$INV/simulate" -d '{"outcome":"paid"}' | jq -e '.status == "paid" and .paid_at != null and .period_end != null'
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "localhost:8080/v1/billing/invoices/$INV/simulate" -d '{"outcome":"paid"}' | jq -e '.status == "paid"'
          # Analisis AI & batas alert mengikuti paket (token baru membawa klaim plan).
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "localhost:8080/v1/market/instruments/BBCA/ai"); test "$code" = 403
          # Asisten AI & analisis chart: anonim 401, Free 403.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' localhost:8080/v1/ai/chat -d '{"messages":[{"role":"user","content":"Kondisi pasar?"}]}'); test "$code" = 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' localhost:8080/v1/ai/chat -d '{"messages":[{"role":"user","content":"Kondisi pasar?"}]}'); test "$code" = 403
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -F note=x localhost:8080/v1/ai/chart); test "$code" = 403
          code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:8080/v1/market/instruments/BBCA/ai"); test "$code" = 401
          PTOK=$(curl -sf -X POST localhost:8080/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"Sandi-rahasia1"}' | jq -r .access_token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $PTOK" "localhost:8080/v1/market/instruments/BBCA/ai"); test "$code" != 403 && test "$code" != 401
          curl -sf -H "Authorization: Bearer $PTOK" localhost:8080/v1/me/profile | jq -e '.alert_limit == 0'
          # Plus: Asisten AI terbuka (CI tanpa kunci Gemini → 503, bukan 401/403); validasi input tetap jalan.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $PTOK" -H 'Content-Type: application/json' localhost:8080/v1/ai/chat -d '{"messages":[{"role":"user","content":"Kondisi pasar?"}]}'); test "$code" = 503
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $PTOK" -H 'Content-Type: application/json' localhost:8080/v1/ai/chat -d '{"messages":[{"role":"assistant","content":"halo"}]}'); test "$code" = 400
          printf 'bukan gambar' > /tmp/x.txt
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $PTOK" -F "file=@/tmp/x.txt;type=image/png" localhost:8080/v1/ai/chart); test "$code" -ge 400 && test "$code" -lt 500
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8080/v1/billing/subscription | jq -e '.data.plan_code == "essential" and .data.status == "active"'
          curl -sf -H "Authorization: Bearer $TOKEN" "localhost:8080/v1/me/notifications?kind=billing" | jq -e '.data | length == 1'
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' localhost:8080/v1/billing/subscription/cancel -d '{}' | jq -e '.data.cancel_at_period_end == true'
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8080/v1/billing/invoices | jq -e '.data | length == 1'
          # Perpanjangan: invoice kedua memperpanjang langganan yang sama 1 bulan.
          INV2=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' localhost:8080/v1/billing/checkout -d '{"plan_code":"essential","method":"va_bca"}' | jq -r .invoice.id)
          END1=$(curl -sf -H "Authorization: Bearer $TOKEN" localhost:8080/v1/billing/subscription | jq -r .data.current_period_end)
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "localhost:8080/v1/billing/invoices/$INV2/simulate" -d '{"outcome":"paid"}' > /dev/null
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8080/v1/billing/subscription | jq -e --arg e "$END1" '.data.current_period_end > $e and .data.cancel_at_period_end == false'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/v1/billing/midtrans/notify -H 'Content-Type: application/json' -d '{"order_id":"x","status_code":"200","gross_amount":"1.00","signature_key":"x"}'); test "$code" = 503
          # Redaksi: penulis & editor — CRUD artikel lengkap.
          for who in penulis editor; do
            curl -sf -X POST localhost:8080/v1/auth/register -H 'Content-Type: application/json' -d "{\"email\":\"$who@example.com\",\"password\":\"Sandi-rahasia1\",\"full_name\":\"CI $who\"}" > /dev/null
            curl -sf -X POST localhost:8080/v1/auth/verify -H 'Content-Type: application/json' -d "{\"email\":\"$who@example.com\",\"code\":\"000000\"}" > /dev/null
          done
          PGPASSWORD=ci psql -h localhost -U oceanpedia -d oceanpedia -c "UPDATE users SET role='author' WHERE email='penulis@example.com'; UPDATE users SET role='editor' WHERE email='editor@example.com'; UPDATE users SET two_factor=false WHERE email IN ('penulis@example.com','editor@example.com');"
          tok() { curl -sf -X POST localhost:8080/v1/auth/login -H 'Content-Type: application/json' -d "{\"email\":\"$1@example.com\",\"password\":\"Sandi-rahasia1\"}" | jq -r .access_token; }
          AU="Authorization: Bearer $(tok penulis)"; ED="Authorization: Bearer $(tok editor)"
          ART='{"title":"Uji CI: IHSG menguat di sesi pertama","excerpt":"Ringkasan uji CI.","body":"JAKARTA — IHSG ditutup menguat pada sesi pertama ditopang **saham bank** besar.\n\n- Poin satu\n- Poin dua\n\nParagraf ketiga uji.","category":"saham","symbols":["BBCA"],"action":"review"}'
          ID=$(curl -sf -X POST -H "$AU" -H 'Content-Type: application/json' localhost:8080/v1/admin/articles -d "$ART" | jq -r .id)
          curl -sf -H "$AU" "localhost:8080/v1/admin/articles?status=review" | jq -e --arg id "$ID" '(.data | map(.id) | index($id)) != null and .counts.all >= 1'
          curl -sf -X PUT -H "$AU" -H 'Content-Type: application/json' "localhost:8080/v1/admin/articles/$ID" -d "$(echo "$ART" | jq -c '.title="Uji CI: judul diperbarui" | .action="draft"')" | jq -e '.title == "Uji CI: judul diperbarui" and .status == "draft"'
          curl -sf -H "$AU" "localhost:8080/v1/admin/articles/$ID" | jq -e '.symbols == ["BBCA"]'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "$AU" "localhost:8080/v1/admin/articles/$ID"); test "$code" = 204
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$AU" "localhost:8080/v1/admin/articles/$ID"); test "$code" = 404
          ID=$(curl -sf -X POST -H "$AU" -H 'Content-Type: application/json' localhost:8080/v1/admin/articles -d "$ART" | jq -r .id)
          curl -sf -X POST -H "$ED" -H 'Content-Type: application/json' "localhost:8080/v1/admin/articles/$ID/status" -d '{"action":"publish"}' | jq -e '.status == "published"'
          SLUG=$(curl -sf -H "$ED" "localhost:8080/v1/admin/articles/$ID" | jq -r .slug)
          code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:8080/v1/articles/$SLUG"); test "$code" = 200
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "$AU" "localhost:8080/v1/admin/articles/$ID"); test "$code" = 409
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "$ED" "localhost:8080/v1/admin/articles/$ID"); test "$code" = 409
          curl -sf -X POST -H "$ED" -H 'Content-Type: application/json' "localhost:8080/v1/admin/articles/$ID/status" -d '{"action":"archive"}' | jq -e '.status == "archived"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "$ED" "localhost:8080/v1/admin/articles/$ID"); test "$code" = 204
          code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:8080/v1/articles/$SLUG"); test "$code" = 404
          # Penulis menerbitkan langsung tanpa review, menarik ke draf, lalu menghapus.
          PUB=$(curl -sf -X POST -H "$AU" -H 'Content-Type: application/json' localhost:8080/v1/admin/articles -d "$(echo "$ART" | jq -c '.title="Uji CI: penulis terbit langsung" | .action="publish"')")
          echo "$PUB" | jq -e '.status == "published"'
          PID=$(echo "$PUB" | jq -r .id); PSLUG=$(echo "$PUB" | jq -r .slug)
          code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:8080/v1/articles/$PSLUG"); test "$code" = 200
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$AU" -H 'Content-Type: application/json' "localhost:8080/v1/admin/articles/$PID/status" -d '{"action":"reject","note":"x"}'); test "$code" = 403
          curl -sf -X POST -H "$AU" -H 'Content-Type: application/json' "localhost:8080/v1/admin/articles/$PID/status" -d '{"action":"unpublish"}' | jq -e '.status == "draft"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "$AU" "localhost:8080/v1/admin/articles/$PID"); test "$code" = 204
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$AU" -H 'Content-Type: application/json' localhost:8080/v1/admin/articles -d "$(echo "$ART" | jq -c '.title="Uji CI: penulis breaking" | .is_breaking=true | .action="publish"')"); test "$code" = 422
          # RBAC dari database: Super Admin mengubah matriks, mengundang, mengganti role, memblokir.
          curl -sf -X POST localhost:8080/v1/auth/register -H 'Content-Type: application/json' -d '{"email":"super@example.com","password":"Sandi-rahasia1","full_name":"CI Super"}' > /dev/null
          curl -sf -X POST localhost:8080/v1/auth/verify -H 'Content-Type: application/json' -d '{"email":"super@example.com","code":"000000"}' > /dev/null
          PGPASSWORD=ci psql -h localhost -U oceanpedia -d oceanpedia -c "UPDATE users SET role='superadmin' WHERE email='super@example.com'; UPDATE users SET two_factor=false WHERE email='super@example.com';"
          SU="Authorization: Bearer $(tok super)"
          curl -sf -X POST localhost:8080/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"super@example.com","password":"Sandi-rahasia1"}' | jq -e '.user.is_staff and (.user.permissions | index("rbac.manage")) != null and .user.role_name == "Super Admin"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$ED" localhost:8080/v1/admin/rbac); test "$code" = 403
          curl -sf -H "$SU" localhost:8080/v1/admin/rbac | jq -e '(.permissions | length) == 16 and (.matrix.author | index("content.publish_own")) != null'
          # Cabut publish_own penulis → penulis tak bisa terbit langsung (tanpa login ulang), lalu kembalikan.
          curl -sf -X PUT -H "$SU" -H 'Content-Type: application/json' localhost:8080/v1/admin/rbac/matrix -d '{"matrix":{"author":["content.write"]}}' | jq -e '.matrix.author == ["content.write"]'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$AU" -H 'Content-Type: application/json' localhost:8080/v1/admin/articles -d "$(echo "$ART" | jq -c '.action="publish"')"); test "$code" = 403
          curl -sf -X PUT -H "$SU" -H 'Content-Type: application/json' localhost:8080/v1/admin/rbac/matrix -d '{"matrix":{"author":["content.write","content.publish_own"]}}' > /dev/null
          # Redaksi lanjutan: dashboard, versi, breaking & live, short, newsletter, laporan, cari, pengaturan.
          curl -sf -H "$SU" localhost:8080/v1/admin/dashboard | jq -e '(.stats.readers >= 1) and (.review | type == "array") and .quota_daily == 800'
          curl -sf -H "$SU" localhost:8080/v1/admin/feed | jq -e '.data | type == "array"'
          curl -sf -H "$SU" localhost:8080/v1/admin/reports | jq -e '(.revenue | length == 30) and (.totals.revenue >= 0)'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$AU" localhost:8080/v1/admin/reports); test "$code" = 403
          curl -sf -H "$SU" "localhost:8080/v1/admin/search?q=bbca" | jq -e '[.data[] | select(.kind == "symbol" and .id == "BBCA")] | length == 1'
          curl -sf -H "$SU" localhost:8080/v1/admin/settings | jq -e '([.integrations[].key] | index("midtrans")) != null and (tostring | contains("SERVER_KEY") | not)'
          VID=$(curl -sf -X POST -H "$AU" -H 'Content-Type: application/json' localhost:8080/v1/admin/articles -d "$(echo "$ART" | jq -c '.title="Uji CI riwayat versi artikel" | .action="draft"')" | jq -r .id)
          curl -sf -X PUT -H "$AU" -H 'Content-Type: application/json' "localhost:8080/v1/admin/articles/$VID" -d "$(echo "$ART" | jq -c '.title="Uji CI riwayat versi artikel (revisi)" | .action="draft"')" > /dev/null
