name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: oceanpedia, POSTGRES_PASSWORD: ci, POSTGRES_DB: oceanpedia }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oceanpedia" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://oceanpedia:ci@localhost:5432/oceanpedia?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache: false }
      - name: Modul
        run: go mod tidy && go mod verify
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Unit test
        run: go test -race -count=1 ./...
      - name: Integration test (PostgreSQL)
        shell: bash
        run: |
          set -o pipefail
          # Baris kegagalan juga ditulis sebagai anotasi agar terlihat tanpa membuka log lengkap.
          go test -count=1 -tags integration ./internal/store/ 2>&1 | tee /tmp/it.log || { grep -E "FAIL|_test.go:|panic|ERROR" /tmp/it.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - run: go build -trimpath -o bin/api ./cmd/api
      - uses: actions/upload-artifact@v4
        with: { name: api-bin, path: api/bin/api, retention-days: 3 }

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }
      - name: Simpan build
        run: tar -czf /tmp/web-build.tgz .next public package.json node_modules next.config.ts
      - uses: actions/upload-artifact@v4
        with: { name: web-build, path: /tmp/web-build.tgz, retention-days: 3 }

  smoke:
    name: Smoke test (desktop vs mobile)
    needs: [api, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: oceanpedia, POSTGRES_PASSWORD: ci, POSTGRES_DB: oceanpedia }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oceanpedia" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://oceanpedia:ci@localhost:5432/oceanpedia?sslmode=disable
      API_JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      API_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/download-artifact@v4
        with: { name: api-bin, path: bin }
      - uses: actions/download-artifact@v4
        with: { name: web-build, path: /tmp }
      - name: Jalankan API + seed
        run: |
          chmod +x bin/api
          ./bin/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 1; done
          PGPASSWORD=ci psql -h localhost -U oceanpedia -d oceanpedia -v ON_ERROR_STOP=1 -f db/seed/dev_seed.sql
      - name: Uji API
        run: |
          set -e
          curl -sf localhost:8080/v1/home | jq -e '.latest | length > 5'
          curl -sf "localhost:8080/v1/market/quotes?symbols=BBCA,BTCUSD" | jq -e '.data | length == 2'
          curl -sf "localhost:8080/v1/ads?surface=web&page=legal" | jq -e '.data | length == 2'
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/articles/tidak-ada); test "$code" = 404
          # Daftar → wajib OTP (kode pengembangan 000000) → masuk tanpa OTP.
          curl -sf -X POST localhost:8080/v1/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"Sandi-rahasia1","full_name":"CI Bot","phone":"0812 3456 7890"}' | jq -e '.status == "verification_required"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"Sandi-rahasia1"}'); test "$code" = 403
          curl -sf -X POST localhost:8080/v1/auth/verify -H 'Content-Type: application/json' -d '{"email":"ci@example.com","code":"000000"}' | jq -e '.access_token | length > 20'
          curl -sf -X POST localhost:8080/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"Sandi-rahasia1"}' | jq -e '.user.email_verified == true'
          curl -sf "localhost:8080/v1/search?q=bbca" | jq -e '.result.instruments[0].symbol == "BBCA"'
          # Profil: baca, ubah data & preferensi, perangkat aktif.
          TOKEN=$(curl -sf -X POST localhost:8080/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"Sandi-rahasia1"}' | jq -r .access_token)
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8080/v1/me/profile | jq -e '.profile.stats.watchlist == 0 and .alert_limit == 3'
          curl -sf -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' localhost:8080/v1/me -d '{"full_name":"CI Bot 2","preferences":{"breaking":false,"theme":"dark"}}' | jq -e '.profile.full_name == "CI Bot 2" and .profile.preferences.breaking == false'
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8080/v1/me/sessions | jq -e '.data | length >= 1'
          # Redaksi: penulis & editor — CRUD artikel lengkap.
          for who in penulis editor; do
            curl -sf -X POST localhost:8080/v1/auth/register -H 'Content-Type: application/json' -d "{\"email\":\"$who@example.com\",\"password\":\"Sandi-rahasia1\",\"full_name\":\"CI $who\"}" > /dev/null
            curl -sf -X POST localhost:8080/v1/auth/verify -H 'Content-Type: application/json' -d "{\"email\":\"$who@example.com\",\"code\":\"000000\"}" > /dev/null
          done
          PGPASSWORD=ci psql -h localhost -U oceanpedia -d oceanpedia -c "UPDATE users SET role='author' WHERE email='penulis@example.com'; UPDATE users SET role='editor' WHERE email='editor@example.com';"
          tok() { curl -sf -X POST localhost:8080/v1/auth/login -H 'Content-Type: application/json' -d "{\"email\":\"$1@example.com\",\"password\":\"Sandi-rahasia1\"}" | jq -r .access_token; }
          AU="Authorization: Bearer $(tok penulis)"; ED="Authorization: Bearer $(tok editor)"
          ART='{"title":"Uji CI: IHSG menguat di sesi pertama","excerpt":"Ringkasan uji CI.","body":"JAKARTA — IHSG ditutup menguat pada sesi pertama ditopang **saham bank** besar.\n\n- Poin satu\n- Poin dua\n\nParagraf ketiga uji.","category":"saham","symbols":["BBCA"],"action":"review"}'
          ID=$(curl -sf -X POST -H "$AU" -H 'Content-Type: application/json' localhost:8080/v1/admin/articles -d "$ART" | jq -r .id)
          curl -sf -H "$AU" "localhost:8080/v1/admin/articles?status=review" | jq -e --arg id "$ID" '(.data | map(.id) | index($id)) != null and .counts.all >= 1'
          curl -sf -X PUT -H "$AU" -H 'Content-Type: application/json' "localhost:8080/v1/admin/articles/$ID" -d "$(echo "$ART" | jq -c '.title="Uji CI: judul diperbarui" | .action="draft"')" | jq -e '.title == "Uji CI: judul diperbarui" and .status == "draft"'
          curl -sf -H "$AU" "localhost:8080/v1/admin/articles/$ID" | jq -e '.symbols == ["BBCA"]'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "$AU" "localhost:8080/v1/admin/articles/$ID"); test "$code" = 204
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$AU" "localhost:8080/v1/admin/articles/$ID"); test "$code" = 404
          ID=$(curl -sf -X POST -H "$AU" -H 'Content-Type: application/json' localhost:8080/v1/admin/articles -d "$ART" | jq -r .id)
          curl -sf -X POST -H "$ED" -H 'Content-Type: application/json' "localhost:8080/v1/admin/articles/$ID/status" -d '{"action":"publish"}' | jq -e '.status == "published"'
          SLUG=$(curl -sf -H "$ED" "localhost:8080/v1/admin/articles/$ID" | jq -r .slug)
          code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:8080/v1/articles/$SLUG"); test "$code" = 200
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "$AU" "localhost:8080/v1/admin/articles/$ID"); test "$code" = 403
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "$ED" "localhost:8080/v1/admin/articles/$ID"); test "$code" = 409
          curl -sf -X POST -H "$ED" -H 'Content-Type: application/json' "localhost:8080/v1/admin/articles/$ID/status" -d '{"action":"archive"}' | jq -e '.status == "archived"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "$ED" "localhost:8080/v1/admin/articles/$ID"); test "$code" = 204
          code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:8080/v1/articles/$SLUG"); test "$code" = 404
          echo "$ART" > /tmp/art.json
      - name: Jalankan web
        run: |
          mkdir -p /tmp/web && tar -xzf /tmp/web-build.tgz -C /tmp/web
          cd /tmp/web && API_INTERNAL_URL=http://localhost:8080 npx next start -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000 -o /dev/null && break; sleep 1; done
      - name: Desktop → UI website, ponsel → UI app
        run: |
          set -e
          DESK='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          MOB='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148'
          curl -sf -A "$DESK" localhost:3000/ | grep -q 'class="dc-frame-web"'
          curl -sf -A "$MOB" localhost:3000/ | grep -q 'class="dc-frame-app"'
          curl -sf -A "$DESK" localhost:3000/berita/ihsg-menguat-ditopang-saham-perbankan | grep -q 'IHSG Menguat Ditopang Saham Perbankan'
          curl -sf -A "$MOB" localhost:3000/berita/ihsg-menguat-ditopang-saham-perbankan | grep -q 'class="dc-frame-app"'
          curl -sf -A "$MOB" localhost:3000/market/BBCA | grep -q 'class="dc-frame-app"'
          curl -sf -A "$DESK" localhost:3000/kategori/crypto | grep -q 'Crypto'
          curl -sf -A "$DESK" localhost:3000/kalender | grep -q 'class="dc-frame-web"'
          curl -sf -A "$DESK" localhost:3000/legal | grep -q 'class="dc-frame-web"'
          curl -sf -A "$DESK" localhost:3000/admin/masuk | grep -q 'data-login-submit'
          curl -sf -A "$MOB" localhost:3000/masuk | grep -q 'data-login-submit'
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/admin); test "$code" = 307
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/berita/tidak-ada); test "$code" = 404
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/halaman-tidak-ada); test "$code" = 404
          # Alur akun & pencarian.
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "$MOB" localhost:3000/akun); test "$code" = 307
          curl -sf -A "$MOB" localhost:3000/daftar | grep -q 'data-reg-submit'
          curl -sf -A "$DESK" localhost:3000/daftar | grep -q 'data-reg-submit'
          curl -sf -A "$MOB" "localhost:3000/verifikasi?email=ci%40example.com&mode=signup" | grep -q 'data-otp-input'
          curl -sf -A "$DESK" "localhost:3000/cari?q=bbca" | grep -q '/market/BBCA'
          curl -sf -A "$MOB" "localhost:3000/cari?q=bbca" | grep -q 'data-search-input'
          # Penulis di HP: masuk lewat web, Tulis artikel & Konten tampil responsif, simpan → tampil di Konten.
          curl -sf -c /tmp/jar -A "$MOB" -X POST localhost:3000/api/auth/login -H 'Content-Type: application/json' -d '{"email":"penulis@example.com","password":"Sandi-rahasia1"}' > /dev/null
          ED_HTML=$(curl -sf -b /tmp/jar -A "$MOB" localhost:3000/admin/tulis)
          echo "$ED_HTML" | grep -q 'class="dc-admin"'
          echo "$ED_HTML" | grep -q 'data-ed-actions'
          echo "$ED_HTML" | grep -q 'data-ed-tool="image"'
          NEW=$(curl -sf -b /tmp/jar -A "$MOB" -X POST localhost:3000/api/admin/articles -H 'Content-Type: application/json' -d "$(jq -c '.title="Uji CI dari HP: rupiah stabil hari ini" | .action="review"' /tmp/art.json)" | jq -r .id)
          curl -sf -b /tmp/jar -A "$MOB" "localhost:3000/admin/tulis?id=$NEW" | grep -q 'Uji CI dari HP: rupiah stabil hari ini'
          curl -sf -b /tmp/jar -A "$MOB" "localhost:3000/admin/konten?status=review&id=$NEW" | grep -q 'data-cnt-action="delete"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/jar -A "$MOB" -X DELETE "localhost:3000/api/admin/articles/$NEW"); test "$code" = 204
          # Format isi artikel (tebal & daftar) tampil di halaman publik.
          EID=$(curl -sf -X POST -H "Authorization: Bearer $(curl -sf -X POST localhost:8080/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"editor@example.com","password":"Sandi-rahasia1"}' | jq -r .access_token)" -H 'Content-Type: application/json' localhost:8080/v1/admin/articles -d "$(jq -c '.title="Uji CI format isi artikel publik" | .action="publish"' /tmp/art.json)" | jq -r .slug)
          curl -sf -A "$DESK" "localhost:3000/berita/$EID" | grep -q '<strong>saham bank</strong>'
          # Semua rute desain dapat dirender (desktop & ponsel).
          for p in / /market /market/BTCUSD /kalender /cari /watchlist /alert /notifikasi /live /short /tersimpan /penulis/maya-lestari /topik/ihsg /offline /daftar /verifikasi /selamat-datang /splash /plus /plus/baca /plus/analisis /plus/checkout /plus/menunggu-pembayaran /plus/berhasil /plus/email /plus/whatsapp /screener /newsletter /tentang /iklan /bantuan /admin/masuk/lupa; do
            for ua in "$DESK" "$MOB"; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -A "$ua" "localhost:3000$p"); test "$code" = 200 || { echo "GAGAL $p ($code)"; exit 1; }
            done
          done
      - name: Log bila gagal
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/web.log || true
