          ! curl -sf -A "$DESK" localhost:3000/ | grep -q 'data-ai-fab'
          code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/pjar -X POST -H 'Content-Type: application/json' localhost:3000/api/ai/chat -d '{"messages":[{"role":"user","content":"Kondisi pasar?"}]}'); test "$code" = 503
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' localhost:3000/api/ai/chat -d '{"messages":[{"role":"user","content":"x"}]}'); test "$code" = 401
          # Halaman tagihan butuh login.
          for p in /plus/menunggu-pembayaran /plus/berhasil /plus/email /plus/whatsapp; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "$MOB" "localhost:3000$p"); test "$code" = 307 || { echo "GAGAL $p ($code)"; exit 1; }
          done
      - name: Log bila gagal
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/web.log || true
