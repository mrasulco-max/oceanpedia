name: Lockfiles

# Membuat/memperbarui go.sum dan package-lock.json lalu meng-commit-nya.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd api && go mod tidy
      - run: cd web && npm install --package-lock-only --no-audit --no-fund
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/go.mod api/go.sum web/package-lock.json
          git diff --cached --quiet || git commit -m "chore: perbarui lockfile (go.sum, package-lock.json)"
          git push
